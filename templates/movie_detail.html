{% extends 'base.html' %}
{% block content %}
<div class="detail">
    <img src="{{movie.image.url}}" alt="{{movie.name}}">
    <h1>{{movie.name}}</h1>
    <h3>Genre: {{movie.genre.name}}</h3>
    <p>{{movie.caption}}</p>
    <br>
    <a href="http://127.0.0.1:8000/movie/{{movie.id}}/comment/" class="btn"> Add Comment</a>
</div>
<br>
<h2>Comments</h2>
{% for comment in comments %}
<div class="comm">
    <h3>{{comment.username}}</h3>
    <p>{{comment.text}}</p>
</div>
{% endfor %}
{% endblock %}
