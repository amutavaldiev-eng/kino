{% extends 'base.html' %}
{% block content %}
<h1>{{genre.name}}</h1>
<div class="grid">
    {% for movie in movies %}
    <div class="card">
        <img src="{{movie.image.url}}" alt="{{movie.name}}">
        <h3>{{movie.name }}</h3>
        <p>{{movie.caption}}</p>
        <a href="http://127.0.0.1:8000/movie/{{movie.id}}/" class="btn">Details
        </a>
    </div>
    {% endfor %}
</div>
{% endblock %}
